unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mode-keys vi

set -g mouse on
set -g history-limit 10000

set -g set-clipboard on
# Wayland vs X11 clipboard tool, picked at copy time so the same config works
# in either session type (GNOME's default has been Wayland since 22.04). tmux
# doesn't support shell variables in its own syntax, so the conditional is
# inlined as a literal `sh -c` command in both bindings.
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "sh -c 'if [ \"$XDG_SESSION_TYPE\" = wayland ]; then wl-copy; else xclip -selection clipboard; fi'"
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "sh -c 'if [ \"$XDG_SESSION_TYPE\" = wayland ]; then wl-copy; else xclip -selection clipboard; fi'"
